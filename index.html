<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteCuts Barbershop</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
body{
margin:0;
font-family:Poppins;
background:#0f0f0f;
color:white;
}

/* HERO */
.hero{
height:60vh;
background:url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::after{
content:"";
position:absolute;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.6);
}

.hero h1{
position:relative;
font-family:"Playfair Display";
font-size:45px;
letter-spacing:3px;
z-index:1;
}

.hero p{
position:relative;
z-index:1;
color:#ccc;
}

/* NAV */
nav{
display:flex;
justify-content:center;
gap:15px;
padding:15px;
border-bottom:1px solid #222;
}

nav button{
background:none;
border:none;
color:#ccc;
cursor:pointer;
}

/* SECTIONS */
section{
padding:40px 20px;
max-width:900px;
margin:auto;
}

h2{
font-family:"Playfair Display";
}

/* CARDS */
.card{
background:#1a1a1a;
padding:15px;
margin:10px 0;
border-radius:10px;
border:1px solid #222;
}

/* INPUTS */
input,textarea,select{
width:100%;
padding:12px;
margin-top:10px;
background:#111;
border:1px solid #333;
color:white;
border-radius:5px;
}

button{
padding:12px;
background:white;
color:black;
border:none;
width:100%;
margin-top:10px;
font-weight:bold;
cursor:pointer;
}

/* GALLERY */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
margin-top:20px;
}

.grid img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

/* HIDE */
.hidden{display:none;}

footer{
text-align:center;
padding:30px;
color:#666;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
<div>
<h1>ELITECUTS</h1>
<p>Sharp cuts. Clean style. Premium grooming.</p>
</div>
</div>

<!-- NAV -->
<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('services')">Services</button>
<button onclick="show('booking')">Book</button>
<button onclick="show('gallery')">Gallery</button>
<button onclick="show('reviews')">Reviews</button>
</nav>

<!-- HOME -->
<section id="home">
<h2>Welcome</h2>
<p style="color:#aaa">
Premium barbershop experience with modern precision and style.
</p>
</section>

<!-- SERVICES -->
<section id="services" class="hidden">
<h2>Services & Prices</h2>

<div class="card">✂️ Haircut - GH₵50</div>
<div class="card">🪒 Beard Trim - GH₵30</div>
<div class="card">💈 VIP Service - GH₵120</div>
</section>

<!-- BOOKING + PAYMENT -->
<section id="booking" class="hidden">
<h2>Book Appointment</h2>

<form id="bookingForm">

<input type="text" placeholder="Full Name" required>
<input type="tel" placeholder="Phone Number" required>
<input type="date" required>
<input type="time" required>

<select id="service" required>
<option value="">Select Service</option>
<option value="Haircut - 50">Haircut (GH₵50)</option>
<option value="Beard Trim - 30">Beard Trim (GH₵30)</option>
<option value="VIP - 120">VIP (GH₵120)</option>
</select>

<select id="payment" required>
<option value="">Payment Method</option>
<option value="Mobile Money">Mobile Money</option>
<option value="Pay at Shop">Pay at Shop</option>
</select>

<button type="submit">Confirm Booking</button>
</form>
</section>

<!-- GALLERY -->
<section id="gallery" class="hidden">
<h2>Gallery</h2>

<div class="grid">
<img src="https://images.unsplash.com/photo-1517832606299-7ae9b720a186">
<img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033">
<img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9">
<img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a">
</div>
</section>

<!-- REVIEWS -->
<section id="reviews" class="hidden">
<h2>Reviews</h2>

<form id="reviewForm">
<textarea placeholder="Write your review..." required></textarea>
<button type="submit">Submit</button>
</form>

<div id="reviewBox"></div>
</section>

<footer>
© 2026 EliteCuts Barbershop
</footer>

<script>
emailjs.init("RTqqdFKtqt6kjRQUy");

// NAV
function show(page){
document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
document.getElementById(page).classList.remove("hidden");
}

// BOOKING + EMAIL
document.getElementById("bookingForm").addEventListener("submit",function(e){
e.preventDefault();

let i=this.querySelectorAll("input");
let name=i[0].value;
let phone=i[1].value;
let date=i[2].value;
let time=i[3].value;

let service=document.getElementById("service").value;
let payment=document.getElementById("payment").value;

// AM/PM
let [h,m]=time.split(":");
h=parseInt(h);
let period=h>=12?"PM":"AM";
if(h>12)h-=12;
if(h===0)h=12;

let finalTime=`${h}:${m} ${period}`;

// SEND EMAIL
emailjs.send("service_wzrlvsj","template_hiukdhm",{
name:name,
phone:phone,
date:date,
time:finalTime,
service:service,
payment:payment
}).then(()=>{
alert("Booking sent successfully!");
this.reset();
});
});

// REVIEWS
document.getElementById("reviewForm").addEventListener("submit",function(e){
e.preventDefault();

let review=this.querySelector("textarea").value;

let reviews=JSON.parse(localStorage.getItem("reviews")||"[]");
reviews.push(review);
localStorage.setItem("reviews",JSON.stringify(reviews));

loadReviews();
this.reset();
});

function loadReviews(){
let reviews=JSON.parse(localStorage.getItem("reviews")||"[]");

document.getElementById("reviewBox").innerHTML=
reviews.map(r=>`<div class="card">${r}</div>`).join("");
}

loadReviews();
</script>

</body>
</html>
